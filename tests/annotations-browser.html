<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OTT 자막 옆 동시 주석 검증</title><style>*{box-sizing:border-box}body{margin:0;background:#14171e;color:white;font:16px sans-serif}#player{position:relative;width:1100px;max-width:100%;height:700px;background:linear-gradient(#1d2430 0 65%,#08090c 85%)}#subtitles{position:absolute;bottom:100px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}#en{font-size:26px;color:#ffd54f;text-align:center;max-width:85%;white-space:pre-wrap}#ko{font-size:30px;text-align:center;max-width:85%;white-space:pre-wrap}</style><main id="player"><div id="subtitles"><div id="en">The actionable intel comes
with a tight clock,</div><div id="ko">정보를 입수했는데
시간이 촉박해</div></div></main><script src="../ott-dual-subs-v2/annotations.js"></script><script>
window.requests=[];window.testSettings={inlineNotes:true};window.ai=false;window.aiResolver=null;window.mockVideo={paused:false,pause(){throw Error('annotations must never pause')},play(){throw Error('annotations must never play')}};
window.controller=OTTDualSubsAnnotations.mount({container:document.querySelector('#player'),englishEl:document.querySelector('#en'),koreanEl:document.querySelector('#ko'),getVideo:()=>mockVideo,getSettings:()=>testSettings,request:async msg=>{requests.push(msg);if(msg.type==='STUDY_STATUS')return{ok:true,configured:true,inlineAI:ai};return new Promise(resolve=>aiResolver=resolve);}});
window.setLine=async(english,korean)=>{document.querySelector('#en').textContent=english;document.querySelector('#ko').textContent=korean;await controller.update({english:english.replace(/\s+/g,' '),korean,previous:'',next:''});};
setLine('The actionable intel comes\nwith a tight clock,','정보를 입수했는데\n시간이 촉박해');
</script></html>
