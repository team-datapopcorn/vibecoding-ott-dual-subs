<!doctype html><html lang="ko"><meta charset="utf-8"><title>OTT 표현 해설 UI 테스트</title><style>body{margin:0;background:#0d1118;color:white;font:16px sans-serif}#player{position:relative;width:100%;height:800px;background:linear-gradient(140deg,#29354a,#0c1322)}#english{position:absolute;left:30px;bottom:110px;max-width:550px;font-size:26px;color:#ffe08a}#korean{position:absolute;left:30px;bottom:70px}#open{position:absolute;left:30px;bottom:20px;padding:10px}</style><main id="player"><div id="english">The actionable intel comes with a tight clock,</div><div id="korean">정보를 입수했는데 시간이 촉박해</div><button id="open">표현 해설</button></main><script src="../ott-dual-subs-v2/study.js"></script><script>
window.events=[];window.video={paused:false,pause(){this.paused=true;events.push('pause')},play(){this.paused=false;events.push('play');return Promise.resolve()}};
window.context={english:'The actionable intel comes with a tight clock,',korean:'정보를 입수했는데 시간이 촉박해',previous:'We finally have a lead.',next:'We should leave now.',selection:''};
window.configured=false;window.requests=[];
window.answer={ok:true,explanation:{summary:'테스트 AI 요약',translationNote:'테스트 번역 이유',phrases:[{expression:'<img src=x onerror=alert(1)>',meaning:'테스트 뜻',breakdown:'<script>bad()</scr'+'ipt>',translationNote:'테스트 설명',exampleEn:'This is an example.',exampleKo:'이것은 예문이에요.'}]}};
window.controller=OTTDualSubsStudy.mount({container:document.querySelector('#player'),englishEl:document.querySelector('#english'),getContext:selection=>({...context,selection}),getVideo:()=>video,request:async message=>{requests.push(message);if(message.type==='STUDY_STATUS')return{ok:true,configured};if(message.type==='STUDY_EXPLAIN')return answer;return{ok:true}}});
document.querySelector('#open').addEventListener('click',()=>controller.open('',document.querySelector('#open')));
</script></html>
