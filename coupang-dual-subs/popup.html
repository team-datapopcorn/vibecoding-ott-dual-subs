<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
    }
    .header .logo {
      font-size: 24px;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }
    .toggle-label {
      font-size: 13px;
      color: #ccc;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #444;
      border-radius: 24px;
      transition: 0.3s;
    }
    .slider:before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider {
      background: #e63b7a;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .status {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
    .status.active {
      color: #4caf50;
    }
    .preview {
      margin-top: 12px;
      background: #0d0d1a;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .preview .ko {
      font-size: 14px;
      color: #fff;
      margin-bottom: 4px;
    }
    .preview .en {
      font-size: 11px;
      color: #ffeb3b;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🍿</span>
    <h1>이중자막</h1>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">이중자막 활성화</span>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="preview">
    <div class="ko">안녕하세요, 반갑습니다</div>
    <div class="en">Hello, nice to meet you</div>
  </div>

  <div class="status" id="status">쿠팡플레이에서 영상을 재생하세요</div>

  <script src="popup.js"></script>
</body>
</html>
